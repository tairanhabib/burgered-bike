name: Supabase keep-alive

# Pings the public gallery view daily so the free Supabase project never hits
# the 7-day inactivity pause. The URL + publishable key are public (the
# publishable key is safe to expose — RLS guards the data), so NO secrets are
# needed. If this ever fails, the logged HTTP status tells you why:
#   404 -> run supabase-setup.sql (the sightings_public view is missing)
#   401 -> key/permission issue

on:
  schedule:
    - cron: '0 12 * * *'    # 12:00 UTC daily
  workflow_dispatch:         # run manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          URL="https://nykjrqgvaljdgevfqyls.supabase.co"
          KEY="sb_publishable_nDMnxt9fCZZsJsx-96qpRw_wFIvi9fe"
          CODE=$(curl -s -o /tmp/body -w "%{http_code}" \
            "$URL/rest/v1/sightings_public?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $CODE"; cat /tmp/body; echo
          if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 400 ]; then
            echo "Keep-alive OK"
          else
            echo "::error::Ping returned HTTP $CODE — see the comment at the top of this file."
            exit 1
          fi
